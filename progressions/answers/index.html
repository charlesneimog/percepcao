<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Respostas - Sala de Progressões</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body data-role="answers">
        <main class="app-shell answers-layout">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Respostas</p>
                    <h2 style="margin-bottom: 20px">Progressões Harmônicas</h2>
                </div>
                <div class="status-pill" id="connection-status">Desconectado</div>
            </header>

            <section class="panel setup-panel">
                <div class="field-grid answers-setup-grid">
                    <label>
                        <span>ID da sala</span>
                        <input id="room-id" autocomplete="off" placeholder="minhaturma" />
                    </label>
                    <label class="screen-reader-field">
                        <span>Seu nome</span>
                        <input id="user-name" autocomplete="off" />
                    </label>
                </div>
                <div class="qr-panel qr-panel-small">
                    <div>
                        <p class="eyebrow">Código QR dos Alunos</p>
                        <p class="quiet" id="student-room-label">Sala: minhaturma</p>
                    </div>
                    <img id="student-qr" alt="Código QR para os alunos entrarem na sala" />
                    <input id="student-link" readonly hidden />
                </div>
                <div class="action-row">
                    <button class="button primary" id="connect-room" type="button">Entrar na Sala</button>
                    <button class="button secondary" id="disconnect-room" type="button" disabled>Desconectar</button>
                </div>
            </section>

            <section class="metrics-grid">
                <article class="metric-card">
                    <span>Alunos</span>
                    <strong id="student-count">0</strong>
                    <em id="student-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Corretas</span>
                    <strong id="correct-count">0</strong>
                    <em id="correct-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Incorretas</span>
                    <strong id="incorrect-count">0</strong>
                    <em id="incorrect-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Sem resposta</span>
                    <strong id="missing-count">0</strong>
                    <em id="missing-percent">0%</em>
                </article>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Resumo</p>
                        <h2>Resultados das Progressões</h2>
                        <p class="quiet" id="exercise-counter">1 exercício no total</p>
                    </div>
                </div>
                <div class="progression-summary" id="progression-summary"></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Ao vivo</p>
                        <h2>Respostas dos Alunos</h2>
                    </div>
                </div>
                <div class="response-list" id="response-list"></div>
            </section>
        </main>

        <script src="../p2p.js"></script>
        <script src="../classroom.js"></script>
    </body>
</html>
