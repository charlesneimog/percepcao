<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Answers - Progression Room</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body data-role="answers">
        <main class="app-shell answers-layout">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Answers</p>
                    <h1>Live Results</h1>
                </div>
                <div class="status-pill" id="connection-status">Offline</div>
            </header>

            <section class="panel setup-panel">
                <div class="field-grid answers-setup-grid">
                    <label>
                        <span>Room ID</span>
                        <input id="room-id" autocomplete="off" placeholder="myclassname" />
                    </label>
                    <label class="screen-reader-field">
                        <span>Your name</span>
                        <input id="user-name" autocomplete="off" />
                    </label>
                </div>
                <div class="qr-panel qr-panel-small">
                    <div>
                        <p class="eyebrow">Student QR Code</p>
                        <p class="quiet" id="student-room-label">Room: myclassname</p>
                    </div>
                    <img id="student-qr" alt="QR code for students to join the room" />
                    <input id="student-link" readonly hidden />
                </div>
                <div class="action-row">
                    <button class="button primary" id="connect-room" type="button">Join Room</button>
                    <button class="button secondary" id="disconnect-room" type="button" disabled>Disconnect</button>
                </div>
            </section>

            <section class="metrics-grid">
                <article class="metric-card">
                    <span>Students</span>
                    <strong id="student-count">0</strong>
                    <em id="student-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Correct</span>
                    <strong id="correct-count">0</strong>
                    <em id="correct-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Incorrect</span>
                    <strong id="incorrect-count">0</strong>
                    <em id="incorrect-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>No answer</span>
                    <strong id="missing-count">0</strong>
                    <em id="missing-percent">0%</em>
                </article>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Summary</p>
                        <h2>Progression Results</h2>
                        <p class="quiet" id="exercise-counter">1 total exercise</p>
                    </div>
                </div>
                <div class="progression-summary" id="progression-summary"></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Live</p>
                        <h2>Student Answers</h2>
                    </div>
                </div>
                <div class="response-list" id="response-list"></div>
            </section>
        </main>

        <script src="../p2p.js"></script>
        <script src="../classroom.js"></script>
    </body>
</html>
