<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Aluno - Sala de Progressões</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body data-role="student">
        <main class="app-shell student-layout">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Aluno</p>
                    <h2 style="margin-bottom: 20px">Progressões Harmônicas</h2>
                </div>
                <div class="status-pill" id="connection-status">Desconectado</div>
            </header>

            <section class="panel setup-panel">
                <div class="field-grid">
                    <label>
                        <span>ID da sala</span>
                        <input id="room-id" autocomplete="off" placeholder="minhaturma" />
                    </label>
                    <label>
                        <span>Seu nome</span>
                        <input id="user-name" autocomplete="off" />
                    </label>
                </div>
                <div class="action-row">
                    <button class="button primary" id="connect-room" type="button">Entrar na Sala</button>
                    <button class="button secondary" id="disconnect-room" type="button" disabled>Desconectar</button>
                </div>
            </section>

            <section class="panel answer-panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Resposta</p>
                        <h2 id="student-prompt">Aguardando progressões</h2>
                    </div>
                </div>
                <div class="block-grid student-blocks" id="student-options"></div>
                <div class="action-row">
                    <button class="button primary" id="send-answer" type="button" disabled>Enviar Resposta</button>
                </div>
                <p class="quiet" id="answer-status">Entre na sala para receber as opções.</p>
            </section>

            <section class="metrics-grid student-score-grid">
                <article class="metric-card">
                    <span>Acertos</span>
                    <strong id="student-right-count">0</strong>
                    <em>respostas</em>
                </article>
                <article class="metric-card">
                    <span>Erros</span>
                    <strong id="student-wrong-count">0</strong>
                    <em>respostas</em>
                </article>
            </section>
        </main>

        <script src="../p2p.js"></script>
        <script src="../classroom.js"></script>
    </body>
</html>
