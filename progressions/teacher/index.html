<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Teacher - Progression Room</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body data-role="teacher">
        <main class="app-shell teacher-layout">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Teacher</p>
                    <h1>Progression Room</h1>
                </div>
                <div class="status-pill" id="connection-status">Offline</div>
            </header>

            <section class="panel setup-panel">
                <div class="field-grid">
                    <label>
                        <span>Room ID</span>
                        <input id="room-id" autocomplete="off" placeholder="myclassname" />
                    </label>
                    <label>
                        <span>Your name</span>
                        <input id="user-name" autocomplete="off" />
                    </label>
                </div>
                <div class="action-row">
                    <button class="button primary" id="connect-room" type="button">Start Room</button>
                    <button class="button secondary" id="disconnect-room" type="button" disabled>Disconnect</button>
                </div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Options</p>
                        <h2>Progressions</h2>
                    </div>
                    <button class="button secondary" id="send-progressions" type="button" disabled>Send Blocks</button>
                </div>
                <label>
                    <span>One progression per line</span>
                    <textarea id="progression-input" rows="6">I - V - vi - IV
ii - V - I
I - IV - V
vi - IV - I - V</textarea>
                </label>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Answer Key</p>
                        <h2>What did you play?</h2>
                    </div>
                    <div class="action-row compact-actions">
                        <button class="button secondary" id="correct-answer" type="button" disabled>
                            Correct the Answer
                        </button>
                        <button class="button danger" id="reset-round" type="button" disabled>New Exercice</button>
                    </div>
                </div>
                <div class="block-grid" id="correct-options"></div>
            </section>

            <section class="metrics-grid">
                <article class="metric-card">
                    <span>Online</span>
                    <strong id="online-count">0</strong>
                    <em>connected</em>
                </article>
                <article class="metric-card">
                    <span>Students</span>
                    <strong id="student-count">0</strong>
                    <em id="student-percent">100%</em>
                </article>
                <article class="metric-card">
                    <span>Correct</span>
                    <strong id="correct-count">0</strong>
                    <em id="correct-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Incorrect</span>
                    <strong id="incorrect-count">0</strong>
                    <em id="incorrect-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>No answer</span>
                    <strong id="missing-count">0</strong>
                    <em id="missing-percent">0%</em>
                </article>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Summary</p>
                        <h2>Progression Results</h2>
                        <p class="quiet" id="exercise-counter">1 total exercise</p>
                    </div>
                </div>
                <div class="progression-summary" id="progression-summary"></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Live</p>
                        <h2>Student Answers</h2>
                    </div>
                </div>
                <div class="response-list" id="response-list"></div>
            </section>
        </main>

        <script src="../p2p.js"></script>
        <script src="../classroom.js"></script>
    </body>
</html>
