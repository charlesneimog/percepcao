<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Professor - Sala de Progressões</title>
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body data-role="teacher">
        <main class="app-shell teacher-layout">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Professor</p>
                    <h2>Progressões Harmônicas</h2>
                </div>
                <div class="status-pill" id="connection-status">Desconectado</div>
            </header>

            <section class="panel setup-panel">
                <div class="field-grid">
                    <label>
                        <span>ID da sala</span>
                        <input id="room-id" autocomplete="off" placeholder="minhaturma" />
                    </label>
                    <label>
                        <span>Seu nome</span>
                        <input id="user-name" autocomplete="off" />
                    </label>
                </div>
                <div class="action-row">
                    <button class="button primary" id="connect-room" type="button">Iniciar Sala</button>
                    <button class="button secondary" id="disconnect-room" type="button" disabled>Desconectar</button>
                </div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Opções</p>
                        <h2>Progressões</h2>
                    </div>
                    <button class="button secondary" id="send-progressions" type="button" disabled>Enviar Blocos</button>
                </div>
                <label>
                    <span>Uma progressão por linha</span>
                    <textarea id="progression-input" rows="6">I - V - vi - IV
ii - V - I
I - IV - V
vi - IV - I - V</textarea>
                </label>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Gabarito</p>
                        <h2>O que você tocou?</h2>
                    </div>
                    <div class="action-row compact-actions">
                        <button class="button secondary" id="correct-answer" type="button" disabled>
                            Alterar resposta correta
                        </button>
                        <button class="button danger" id="reset-round" type="button" disabled>Novo exercício</button>
                    </div>
                </div>
                <div class="block-grid" id="correct-options"></div>
            </section>

            <section class="metrics-grid">
                <article class="metric-card">
                    <span>Conectados</span>
                    <strong id="online-count">0</strong>
                    <em>conectados</em>
                </article>
                <article class="metric-card">
                    <span>Alunos</span>
                    <strong id="student-count">0</strong>
                    <em id="student-percent">100%</em>
                </article>
                <article class="metric-card">
                    <span>Corretas</span>
                    <strong id="correct-count">0</strong>
                    <em id="correct-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Incorretas</span>
                    <strong id="incorrect-count">0</strong>
                    <em id="incorrect-percent">0%</em>
                </article>
                <article class="metric-card">
                    <span>Sem resposta</span>
                    <strong id="missing-count">0</strong>
                    <em id="missing-percent">0%</em>
                </article>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Resumo</p>
                        <h2>Resultados das Progressões</h2>
                        <p class="quiet" id="exercise-counter">1 exercício no total</p>
                    </div>
                </div>
                <div class="progression-summary" id="progression-summary"></div>
            </section>

            <section class="panel">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Ao vivo</p>
                        <h2>Respostas dos Alunos</h2>
                    </div>
                </div>
                <div class="response-list" id="response-list"></div>
            </section>
        </main>

        <script src="../p2p.js"></script>
        <script src="../classroom.js"></script>
    </body>
</html>
